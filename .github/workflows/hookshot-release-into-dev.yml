# Each new Hookshot release merged into dev, so dev builds (scripts/build-game.ps1 -Channel dev) carry it. Daily, or by hand
# (Actions > Hookshot release into dev > Run workflow). It lives on main because GitHub runs scheduled workflows from the default
# branch only; it changes dev alone, never main (the published releases).
# A merge Git cannot make on its own is not pushed: an issue names the files, and the merge is made by hand.
name: Hookshot release into dev

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Merge and report only (no push, no issue)
        type: boolean
        default: false
      branch:
        description: The branch to merge into
        default: dev

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: hookshot-release-into-dev

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch || 'dev' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || 'dev' }}
          fetch-depth: 0
          # (a Hookshot release that changes .github/workflows can only be pushed with a token allowed to: the secret, when set)
          token: ${{ secrets.LONGSHOT_PUSH_TOKEN || github.token }}

      - name: Merge the latest Hookshot release
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(gh api repos/NotRexed/Hookshot/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # (under a name of its own: Hookshot's tags in refs/tags would become the version git describe gives)
          git fetch --no-tags https://github.com/NotRexed/Hookshot.git "refs/tags/$tag:refs/hookshot/$tag"
          if git merge-base --is-ancestor "refs/hookshot/$tag" HEAD; then
            echo "$BRANCH already has Hookshot $tag." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "result=current" >> "$GITHUB_OUTPUT"
          elif git merge --no-ff --no-edit -m "Merge Hookshot $tag into $BRANCH" "refs/hookshot/$tag"; then
            echo "Hookshot $tag merges into $BRANCH on its own: $(git rev-list --count HEAD^1..HEAD^2) commits." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/files.txt"
            git merge --abort
            { echo "Hookshot $tag does not merge into $BRANCH on its own. Changed on both sides:"; sed 's/^/- /' "$RUNNER_TEMP/files.txt"; } \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        id: push
        if: steps.merge.outputs.result == 'merged' && env.DRY_RUN != '1'
        run: |
          set -euo pipefail
          if git push origin "HEAD:$BRANCH"; then
            echo "$BRANCH is now $(git rev-parse --short HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only HEAD^1 HEAD -- .github/workflows > "$RUNNER_TEMP/files.txt"
            echo "The push was refused: the release changes workflow files, and LONGSHOT_PUSH_TOKEN is not set." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "refused=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Checks on the new dev
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (a push by the job's own token starts no workflow: they are asked for)
          gh workflow run source-regressions.yml --ref "$BRANCH" || true
          gh workflow run windows-builder.yml --ref "$BRANCH" || true

      - name: An issue when it needs a hand
        if: env.DRY_RUN != '1' && (steps.merge.outputs.result == 'conflict' || steps.push.outputs.refused == '1')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.merge.outputs.tag }}
          REFUSED: ${{ steps.push.outputs.refused }}
        run: |
          set -euo pipefail
          title="Hookshot $TAG needs merging into $BRANCH by hand"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "The issue is open already."
          else
            {
              echo "The daily merge of Hookshot's latest release ($TAG) into \`$BRANCH\` stopped. Nothing was pushed."
              echo
              if [ "$REFUSED" = "1" ]; then
                echo "It merged, but the release changes workflow files, which this job's token may not push. Add a repository"
                echo "secret \`LONGSHOT_PUSH_TOKEN\` (a token with the workflow scope), or merge it by hand. The files:"
              else
                echo "These files changed on both sides:"
              fi
              echo
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/files.txt"
              echo
              echo "By hand: \`git fetch --no-tags https://github.com/NotRexed/Hookshot.git refs/tags/$TAG:refs/hookshot/$TAG\`,"
              echo "then on \`$BRANCH\`: \`git merge refs/hookshot/$TAG\`, resolve, test, push."
            } > "$RUNNER_TEMP/body.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          exit 1   # (a failed run: GitHub mails it)
